<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card Analyst CA-1325 Patcher</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,system-ui;background:#0b0d0e;color:#f5f7f6;margin:0;padding:28px}.box{max-width:720px;margin:auto;background:#121617;border:1px solid #293033;border-radius:20px;padding:22px}h1{margin:0 0 8px}.muted{color:#929c97;line-height:1.5}.btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font-weight:800;margin-top:14px;background:#63e693;color:#07120a;cursor:pointer}input{margin-top:16px}.log{margin-top:16px;padding:14px;background:#0d1011;border-radius:12px;border:1px solid #22282b;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}
</style></head><body><div class="box"><h1>Card Analyst CA-1325</h1><div class="muted">Select the current <b>index.html</b>. This patches only the Trophy Room investment view and preserves the rest of the file.</div><input id="f" type="file" accept="text/html,.html"><br><button class="btn" id="go">Create patched index.html</button><div id="log" class="log">Waiting for index.html…</div></div><script>
const CSS="\n.trophycard{cursor:pointer}\n.investhero{margin:8px 0 4px}.investvalue{font-size:38px;font-weight:900;letter-spacing:-1.5px}.investreturn{font-size:14px;font-weight:850;margin-top:3px}.investgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.investstat{background:#0e1112;border:1px solid var(--l);border-radius:15px;padding:12px}.investstat small{display:block;color:var(--m);font-size:10px;margin-bottom:5px}.investstat b{font-size:17px}.saleitem{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--l)}.saleitem:last-child{border-bottom:0}.salegrade{display:inline-block;border:1px solid #34403a;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:900;margin-right:6px;color:#c9d5cf}.saledate{color:var(--m);font-size:10px;margin-top:4px}.saleprice{font-size:16px;font-weight:900;text-align:right}.salesource{color:var(--m);font-size:9px;text-align:right;margin-top:3px}.historyempty{text-align:center;padding:46px 10px;color:var(--m);font-size:12px;line-height:1.45}.trange{display:flex;gap:5px;overflow-x:auto;margin-top:11px;scrollbar-width:none}.trange::-webkit-scrollbar{display:none}.trange button{border:1px solid var(--l);background:#0d1011;color:#77817d;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:850}.trange button.active{background:#e9f7ee;color:#07120a;border-color:#e9f7ee}.actiongrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.actionbtn{border:1px solid var(--l);background:#15191b;color:#fff;border-radius:13px;padding:12px;font-weight:850}.actionbtn.danger{color:#ffaaaF;border-color:#4b292d}.actionnote{font-size:10px;color:var(--m);line-height:1.4;margin-top:8px}\n";
const FEATURE_JS="\nlet trophyRange='1M',trophyHistory=[],trophySales=[],trophyOpenIndex=null;\nfunction trophyRangeRows(){let a=trophyHistory||[];if(!a.length||trophyRange==='ALL')return a;let days={'1W':7,'1M':30,'3M':90,'1Y':365}[trophyRange]||30,anchor=new Date((a[a.length-1]?.price_date||new Date().toISOString().slice(0,10))+'T12:00:00'),cut=new Date(anchor.getTime()-days*86400000);return a.filter(x=>new Date(x.price_date+'T12:00:00')>=cut)}\nfunction trophyChartHtml(){let a=trophyRangeRows();if(a.length<2)return `<div class=\"historyempty\"><b>Price history building</b><br>We only draw movement after at least two real daily observations exist in this range.</div>`;let vals=a.map(x=>+x.market_value_per_unit||0),w=500,h=170,p=14,min=Math.min(...vals),max=Math.max(...vals);if(max===min){let d=Math.max(1,max*.025);min=Math.max(0,min-d);max+=d}let X=i=>p+i*(w-2*p)/(a.length-1),Y=v=>h-p-(v-min)*(h-2*p)/(max-min),pts=a.map((r,i)=>`${X(i)},${Y(+r.market_value_per_unit||0)}`).join(' '),area=`${p},${h-p} ${pts} ${w-p},${h-p}`,first=a[0],last=a[a.length-1];return `<svg class=\"chart\" style=\"height:170px\" viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"none\"><line class=\"chartgrid\" x1=\"${p}\" y1=\"${h-p}\" x2=\"${w-p}\" y2=\"${h-p}\"/><polygon class=\"chartarea\" points=\"${area}\"/><polyline class=\"chartline\" points=\"${pts}\"/><text class=\"chartlabel\" x=\"${p}\" y=\"11\">${M(max)}</text><text class=\"chartlabel\" x=\"${p}\" y=\"${h-2}\">${new Date(first.price_date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text><text class=\"chartlabel\" text-anchor=\"end\" x=\"${w-p}\" y=\"${h-2}\">${new Date(last.price_date+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}</text></svg>`}\nfunction drawTrophyInvestmentChart(){let box=$('trophyinvchart');if(box)box.innerHTML=trophyChartHtml();document.querySelectorAll('[data-trange]').forEach(b=>b.classList.toggle('active',b.dataset.trange===trophyRange))}\nfunction setTrophyRange(r){trophyRange=r;drawTrophyInvestmentChart()}\nfunction trophyActionBase(i){let h=S.h[i];return h?{h,c:h.cards||{}}:null}
function trophyEditSheet(i){let x=trophyActionBase(i);if(!x)return;let h=x.h,c=x.c;$('sheet').innerHTML=`<button class="backbtn" onclick="openTrophyInvestment(${i})">← Back</button><div class="muted">EDIT COLLECTION CARD</div><h2>${c.player_name||'Card'}</h2><div class="card"><input id="eyear" class="input" value="${c.year||''}" placeholder="Year"><input id="eset" class="input" value="${C(c.set_name)||''}" placeholder="Set"><input id="eplayer" class="input" value="${c.player_name||''}" placeholder="Player"><input id="enum" class="input" value="${c.card_number||''}" placeholder="Card #"><input id="eparallel" class="input" value="${c.parallel||''}" placeholder="Parallel"><input id="eserial" class="input" type="number" value="${c.serial_numbered_to||''}" placeholder="Serial /99"><input id="egrade" class="input" value="${c.grade||''}" placeholder="Grade"><input id="egrader" class="input" value="${c.grader||''}" placeholder="Grader"><div id="editerr" class="error hidden"></div><button class="btn primary" onclick="saveTrophyEdit(${i})">Save changes</button></div>`}
async function saveTrophyEdit(i){let x=trophyActionBase(i),er=$('editerr');if(!x)return;er.classList.add('hidden');try{await api('/rest/v1/rpc/update_collection_card',{method:'POST',body:JSON.stringify({p_card_id:x.c.id,p_year:$('eyear').value||null,p_set_name:$('eset').value||null,p_player_name:$('eplayer').value||null,p_card_number:$('enum').value||null,p_parallel:$('eparallel').value||null,p_serial_numbered_to:$('eserial').value?+$('eserial').value:null,p_grade:$('egrade').value||null,p_grader:$('egrader').value||null})});await load();openTrophyInvestment(Math.min(i,S.h.length-1))}catch(e){er.textContent=e.message;er.classList.remove('hidden')}}
function trophySaleSheet(i){let x=trophyActionBase(i);if(!x)return;let q=+x.h.quantity||0;$('sheet').innerHTML=`<button class="backbtn" onclick="openTrophyInvestment(${i})">← Back</button><div class="muted">RECORD SALE</div><h2>${x.c.player_name||'Card'}</h2><div class="card"><div class="muted" style="font-size:12px">Owned: ${q}</div><input id="sqty" class="input" type="number" min="0.01" max="${q}" step="1" value="${q}" placeholder="Quantity sold"><input id="sprice" class="input" type="number" min="0" step="0.01" placeholder="Sale price per card"><input id="sfees" class="input" type="number" min="0" step="0.01" value="0" placeholder="Selling fees"><input id="sdate" class="input" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="snotes" class="input" placeholder="Notes (optional)"><div id="saleerr" class="error hidden"></div><button class="btn primary" onclick="saveTrophySale(${i})">Record sale</button></div>`}
async function saveTrophySale(i){let x=trophyActionBase(i),er=$('saleerr');if(!x)return;er.classList.add('hidden');try{await api('/rest/v1/rpc/record_collection_sale',{method:'POST',body:JSON.stringify({p_holding_id:x.h.id,p_quantity:+$('sqty').value,p_price_per_unit:+$('sprice').value,p_fees:+$('sfees').value||0,p_occurred_at:$('sdate').value?$('sdate').value+'T12:00:00Z':new Date().toISOString(),p_notes:$('snotes').value||null})});closeSheet();await load();view('portfolio')}catch(e){er.textContent=e.message;er.classList.remove('hidden')}}
function trophyTradeSheet(i){let x=trophyActionBase(i);if(!x)return;let q=+x.h.quantity||0;$('sheet').innerHTML=`<button class="backbtn" onclick="openTrophyInvestment(${i})">← Back</button><div class="muted">RECORD TRADE OUT</div><h2>${x.c.player_name||'Card'}</h2><div class="card"><div class="muted" style="font-size:12px">Owned: ${q}</div><input id="tqty" class="input" type="number" min="0.01" max="${q}" step="1" value="${q}" placeholder="Quantity traded"><input id="tvalue" class="input" type="number" min="0" step="0.01" placeholder="Agreed trade value per card"><input id="tfees" class="input" type="number" min="0" step="0.01" value="0" placeholder="Trade/shipping fees"><input id="tdate" class="input" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="tnotes" class="input" placeholder="What did you receive?"><div id="tradeerr" class="error hidden"></div><button class="btn primary" onclick="saveTrophyTrade(${i})">Record trade out</button><div class="actionnote">After recording the outgoing card, add the incoming card(s) through Add so each side has its own cost basis.</div></div>`}
async function saveTrophyTrade(i){let x=trophyActionBase(i),er=$('tradeerr');if(!x)return;er.classList.add('hidden');try{await api('/rest/v1/rpc/record_collection_trade_out',{method:'POST',body:JSON.stringify({p_holding_id:x.h.id,p_quantity:+$('tqty').value,p_trade_value_per_unit:+$('tvalue').value,p_fees:+$('tfees').value||0,p_occurred_at:$('tdate').value?$('tdate').value+'T12:00:00Z':new Date().toISOString(),p_notes:$('tnotes').value||null})});closeSheet();await load();view('portfolio')}catch(e){er.textContent=e.message;er.classList.remove('hidden')}}
async function trophyRemoveCorrection(i){let x=trophyActionBase(i);if(!x)return;if(!confirm('Remove this holding as a correction? This is not recorded as a sale.'))return;try{await api('/rest/v1/rpc/remove_collection_holding_correction',{method:'POST',body:JSON.stringify({p_holding_id:x.h.id,p_notes:'Removed from Trophy Room as correction'})});closeSheet();await load();view('portfolio')}catch(e){alert(e.message)}}
async function openTrophyInvestment(i){let h=S.h[i];if(!h)return;trophyOpenIndex=i;trophyRange='1M';let c=h.cards||{},z=q(c.id),qty=+h.quantity||0,unit=z?+z.market_value_per_unit:null,cost=+h.cost_basis||0,value=unit==null?null:unit*qty,pnl=value==null?null:value-cost,ret=cost>0&&pnl!=null?pnl/cost:null,avg=qty>0?cost/qty:0;$('sheet').innerHTML=`<button class=\"backbtn\" onclick=\"closeSheet()\">\u2190 Back</button><div class=\"muted\">TROPHY ROOM \u00b7 POSITION</div><h2 style=\"margin-bottom:5px\">${c.player_name||'Card'}</h2><div class=\"muted\" style=\"font-size:12px;line-height:1.4\">${[c.year,C(c.set_name),c.card_number?'#'+c.card_number:null,c.parallel,c.serial_numbered_to?'/'+c.serial_numbered_to:null].filter(Boolean).join(' \u00b7 ')}</div><div class=\"investhero\"><div class=\"investvalue\">${value!=null?M(value):'\u2014'}</div><div class=\"investreturn ${pnl==null?'muted':pnl>=0?'pnlpos':'pnlneg'}\">${pnl==null?'Current market value pending':`${pnl>=0?'+':''}${M(pnl)} (${ret==null?'\u2014':(ret*100).toFixed(1)+'%'}) total return`}</div></div><div class=\"investgrid\"><div class=\"investstat\"><small>AVG. COST</small><b>${M(avg)}</b></div><div class=\"investstat\"><small>CURRENT / CARD</small><b>${unit!=null?M(unit):'\u2014'}</b></div><div class=\"investstat\"><small>QUANTITY</small><b>${qty}</b></div><div class=\"investstat\"><small>COST BASIS</small><b>${M(cost)}</b></div></div><div class=\"chartcard\"><div class=\"charthead\"><b>Market Value</b><span>Real daily observations</span></div><div id=\"trophyinvchart\"><div class=\"historyempty\">Loading price history\u2026</div></div><div class=\"trange\"><button data-trange=\"1W\" onclick=\"setTrophyRange('1W')\">1W</button><button data-trange=\"1M\" class=\"active\" onclick=\"setTrophyRange('1M')\">1M</button><button data-trange=\"3M\" onclick=\"setTrophyRange('3M')\">3M</button><button data-trange=\"1Y\" onclick=\"setTrophyRange('1Y')\">1Y</button><button data-trange=\"ALL\" onclick=\"setTrophyRange('ALL')\">ALL</button></div></div><div class=\"section\"><h2>Recent Sales</h2><span class=\"muted\" style=\"font-size:10px\">Exact matches only</span></div><div id=\"trophysales\" class=\"card\"><div class=\"muted\" style=\"text-align:center;padding:18px 0\">Loading verified sales\u2026</div></div>`;openSheet();try{[trophyHistory,trophySales]=await Promise.all([api('/rest/v1/daily_price_history?select=price_date,market_value_per_unit,provider,confidence_score,comparable_sales_count&card_id=eq.'+encodeURIComponent(c.id)+'&order=price_date.asc&limit=500'),api('/rest/v1/trophy_room_recent_sales?select=grader,grade,total_price,sold_at,source_name,source_url&card_id=eq.'+encodeURIComponent(c.id)+'&order=sold_at.desc&limit=10')]);drawTrophyInvestmentChart();let el=$('trophysales');if(!el)return;el.innerHTML=trophySales.length?trophySales.map(x=>{let g=x.grader&&x.grade?`${x.grader} ${x.grade}`:'RAW',d=x.sold_at?new Date(x.sold_at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):'Date unknown',src=(x.source_name||'Verified source').replace(/_/g,' ');return `<div class=\"saleitem\"><div><span class=\"salegrade\">${g}</span><div class=\"saledate\">${d}</div></div><div><div class=\"saleprice\">${M(x.total_price)}</div><div class=\"salesource\">${src}</div></div></div>`}).join(''):`<div class=\"historyempty\"><b>No verified recent sales yet</b><br>We will show sales here only after an exact card match clears the confidence threshold.</div>`}catch(e){console.warn(e);if($('trophyinvchart'))$('trophyinvchart').innerHTML='<div class=\"historyempty\">Price history unavailable right now.</div>';if($('trophysales'))$('trophysales').innerHTML='<div class=\"historyempty\">Recent sales unavailable right now.</div>'}}\n";
const OLD_CARD="return `<div class=\"trophycard\" id=\"trophy-${i}\"><div class=\"cardframe\">${img}</div><div class=\"trophyname\">${c.player_name||'Card'}</div><div class=\"trophymeta\">${[c.year,C(c.set_name),c.parallel,c.serial_numbered_to?'/'+c.serial_numbered_to:null].filter(Boolean).join(' \u00b7 ')}</div><div class=\"trophyprice\">${unit!=null?M(unit):'\u2014'}</div><div class=\"trophysub\">${unit!=null?'Current value':'Price pending'}${qty>1?' \u00b7 Qty '+qty:''}</div></div>`";
const NEW_CARD="return `<div class=\"trophycard\" id=\"trophy-${i}\" onclick=\"openTrophyInvestment(${i})\"><div class=\"cardframe\">${img}</div><div class=\"trophyname\">${c.player_name||'Card'}</div><div class=\"trophymeta\">${[c.year,C(c.set_name),c.parallel,c.serial_numbered_to?'/'+c.serial_numbered_to:null].filter(Boolean).join(' \u00b7 ')}</div><div class=\"trophyprice\">${unit!=null?M(unit):'\u2014'}</div><div class=\"trophysub\">${unit!=null?'Current value':'Price pending'}${qty>1?' \u00b7 Qty '+qty:''}</div></div>`";
const ANCHOR="function updateTrophyArrows(){let rail=$('holdings');if(!$('trophyleft')||!$('trophyright'))return;$('trophyleft').disabled=rail.scrollLeft<=2;$('trophyright').disabled=rail.scrollLeft+rail.clientWidth>=rail.scrollWidth-2}";
const log=t=>document.getElementById('log').textContent=t;
document.getElementById('go').onclick=async()=>{
 const file=document.getElementById('f').files[0]; if(!file){log('Choose index.html first.');return}
 let s=await file.text();
 if(!s.includes('BUILD CA-1324 · FULL TROPHY ROOM')&&!s.includes('BUILD CA-1325 · INVESTMENT TROPHY ROOM')){log('This does not look like the expected CA-1324/1325 frontend. No changes made.');return}
 if(!s.includes('.investhero{')) s=s.replace('</style>',CSS+'\n</style>');
 s=s.replaceAll('BUILD CA-1324 · FULL TROPHY ROOM','BUILD CA-1325 · INVESTMENT TROPHY ROOM').replaceAll('?v=CA1324','?v=CA1325');
 if(s.includes(OLD_CARD)) s=s.replace(OLD_CARD,NEW_CARD);
 s=s.replaceAll('onclick="jumpTrophy(${i})"','onclick="openTrophyInvestment(${i})"');
 if(!s.includes('async function openTrophyInvestment(i)')){
   if(!s.includes(ANCHOR)){log('Could not find Trophy Room insertion point. No output created.');return}
   s=s.replace(ANCHOR,ANCHOR+FEATURE_JS);
 }
 const required=['CA-1325 · INVESTMENT TROPHY ROOM','openTrophyInvestment','trophy_room_recent_sales','daily_price_history','record_collection_sale','record_collection_trade_out','remove_collection_holding_correction','update_collection_card'];
 const missing=required.filter(x=>!s.includes(x)); if(missing.length){log('Validation failed: '+missing.join(', '));return}
 const blob=new Blob([s],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 log('Success. Patched index.html downloaded.\n\nUpload that index.html to replace the current frontend.');
};
</script></body></html>
